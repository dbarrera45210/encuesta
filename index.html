<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario IAAAM – IA y automatización en la toma de decisiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #F2F4F6;
    --tarjeta: #FFFFFF;
    --tinta: #1B2433;
    --suave: #5A6577;
    --linea: #D3D9E0;
    --acento: #0F6B5C;
    --acento-osc: #0A4F44;
    --acento-claro: #E1F1EE;
    --error: #B42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Public Sans", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.55;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 1rem; }
  .portada {
    background: var(--tarjeta);
    border: 1px solid var(--linea);
    border-top: 8px solid var(--acento);
    border-radius: 10px;
    padding: 1.5rem 1.5rem 1.25rem;
    margin-bottom: 1rem;
  }
  h1 {
    font-family: "Literata", Georgia, serif;
    font-weight: 700;
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    line-height: 1.2;
    margin: 0 0 .6rem;
  }
  h2 { font-family: "Literata", Georgia, serif; font-size: 1.3rem; line-height: 1.25; margin: 0 0 .5rem; }
  .inst { color: var(--suave); font-size: .92rem; margin: 0; }
  .card {
    background: var(--tarjeta);
    border: 1px solid var(--linea);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }
  .card p { margin: 0 0 .75rem; }
  .card p:last-child { margin-bottom: 0; }
  .card ul { margin: 0 0 .75rem; padding-left: 1.2rem; }
  .card li { margin-bottom: .4rem; }
  .progreso { margin: 0 0 1rem; }
  .progreso .txt { font-size: .88rem; color: var(--suave); margin-bottom: .35rem; }
  .barra { height: 6px; background: var(--linea); border-radius: 3px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--acento); transition: width .25s; }

  fieldset.q {
    border: 1px solid var(--linea);
    border-radius: 10px;
    background: var(--tarjeta);
    margin: 0 0 1rem;
    padding: 1.1rem 1.5rem 1rem;
  }
  fieldset.q legend { font-weight: 600; padding: 0 .4rem; margin-left: -.4rem; }
  fieldset.q legend::after { content: " *"; color: var(--error); }
  fieldset.q.err { border-color: var(--error); box-shadow: inset 4px 0 0 var(--error); }
  .em { display: none; color: var(--error); font-size: .88rem; margin: .5rem 0 0; }
  .err .em { display: block; }

  label.op { display: flex; gap: .65rem; align-items: flex-start; padding: .4rem 0; cursor: pointer; }
  label.op input { margin-top: .3rem; width: 1.05rem; height: 1.05rem; accent-color: var(--acento); flex: none; }
  input[type="text"] {
    width: 100%; font: inherit; color: inherit;
    padding: .55rem .7rem; margin-top: .4rem;
    border: 1.5px solid var(--linea); border-radius: 8px; background: #fff;
  }
  .fila-otro { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .fila-otro label.op { flex: none; }
  input.otro { width: min(14rem, 100%); margin-top: 0; padding: .35rem .6rem; font-size: .92rem; }

  .leyenda {
    display: flex; flex-wrap: wrap; gap: .35rem 1.1rem;
    list-style: none; margin: .6rem 0 0 !important; padding: 0 !important;
    font-size: .88rem;
  }
  .leyenda li { margin: 0; }
  .leyenda b { color: var(--acento); }

  .escala { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .6rem; }
  .escala label { cursor: pointer; }
  .escala input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .escala span {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 3.3rem; height: 3.3rem;
    border: 1.5px solid var(--linea); border-radius: 8px;
    font-weight: 600; line-height: 1.1; background: #fff;
    transition: background .15s, border-color .15s, color .15s;
  }
  .escala small { font-size: .7rem; font-weight: 400; margin-top: .15rem; }
  .escala label:hover span { border-color: var(--acento); }
  .escala input:checked + span { background: var(--acento); border-color: var(--acento); color: #fff; }
  .escala input:focus-visible + span { outline: 3px solid var(--acento); outline-offset: 2px; }
  .cod { color: var(--acento); font-weight: 700; margin-right: .25rem; }

  .nav { display: flex; justify-content: space-between; gap: .75rem; margin: 1.25rem 0 2rem; }
  button {
    font: inherit; font-weight: 600;
    border-radius: 8px; padding: .7rem 1.6rem; cursor: pointer;
    border: 1.5px solid var(--acento);
  }
  .p { background: var(--acento); color: #fff; }
  .p:hover { background: var(--acento-osc); }
  .s { background: transparent; color: var(--acento); }
  .s:hover { background: var(--acento-claro); }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  #aviso { font-weight: 600; color: var(--error); margin: -1rem 0 1.5rem; min-height: 1.2rem; }

  .final { border-top: 8px solid var(--acento); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 520px) {
    fieldset.q, .card, .portada { padding-left: 1rem; padding-right: 1rem; }
    .escala span { width: 2.9rem; height: 3rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="portada">
    <p class="inst" style="margin-bottom:.5rem">Fundación Universitaria del Área Andina · Facultad de Ciencias Administrativas, Económicas y Financieras</p>
    <h1>Cuestionario sobre inteligencia artificial y automatización en la toma de decisiones organizacionales (Modelo IAAAM)</h1>
  </header>

  <div class="progreso" id="progreso" hidden>
    <div class="txt" id="progreso-txt"></div>
    <div class="barra"><i id="progreso-barra"></i></div>
  </div>

  <form id="f" novalidate></form>

  <p id="aviso" role="status" aria-live="polite"></p>

  <div class="nav" id="nav">
    <span><button type="button" class="s" id="atras" hidden>Atrás</button></span>
    <button type="button" class="p" id="siguiente">Siguiente</button>
  </div>

  <section class="card final" id="fin" hidden tabindex="-1"></section>
</div>

<script>
/* ==================================================================
   CONFIGURACIÓN: solo cambia SCRIPT_URL
   ------------------------------------------------------------------
   Pega aquí la URL de tu aplicación web de Google Apps Script
   (termina en /exec). Los pasos están en el archivo Code.gs.
   ================================================================== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwSHrBXki74X2zIPW6MgPmoPw9VblqCq-VmeqyyZGjMswrKiFKy8hx81hwKOKHWeO53gg/exec",
  LIMITAR_UNA_RESPUESTA: true   // una respuesta por navegador (no es una garantía fuerte)
};

/* ---------------- Contenido (tomado del Instrumento_Encuesta_IA_Toma_de_Decisiones.docx) ---------------- */
const ESCALA = [["1", "Totalmente en desacuerdo", "TD"], ["2", "En desacuerdo", "D"], ["3", "Ni de acuerdo ni en desacuerdo", "N"], ["4", "De acuerdo", "A"], ["5", "Totalmente de acuerdo", "TA"]];

const SECCIONES = [
  { t: "Módulo 1: Caracterización demográfica y perfil organizacional",
    d: "Instrucciones: Seleccione la opción que mejor describa su perfil profesional y el contexto de su organización.",
    q: [
      { id: "P1", k: "r", other: true, t: "P1. Sector económico principal de la organización:",
        o: ["Servicios profesionales, consultoría y tecnología", "Comercio al por mayor / al por menor (Retail)", "Manufactura e industria transformadora", "Sector Financiero, bancario y asegurador", "Salud y servicios farmacéuticos", "Educación y sector académico", "Otro sector económico"] },
      { id: "P2", k: "r", t: "P2. Tamaño de la organización según número de colaboradores:",
        o: ["Microempresa (1 a 10 colaboradores)", "Pequeña empresa (11 a 50 colaboradores)", "Mediana empresa (51 a 200 colaboradores)", "Gran empresa (Más de 200 colaboradores)"] },
      { id: "P3", k: "r", t: "P3. Nivel o cargo directivo que desempeña en la empresa:",
        o: ["Alta Gerencia / Dirección General / Presidencia / Junta Directiva", "Gerencia de Área / Jefatura Departamental", "Coordinación / Liderazgo Operativo o Técnico", "Consultoría / Asesoría Estratégica Externa"] },
      { id: "P4", k: "r", t: "P4. Años de experiencia en cargos gerenciales o de toma de decisiones:",
        o: ["Menos de 3 años", "Entre 3 y 5 años", "Entre 6 y 10 años", "Más de 10 años"] },
      { id: "P5", k: "r", t: "P5. Grado de madurez o adopción de Inteligencia Artificial / Automatización en su área:",
        o: ["Nivel 0 (Nulo): No se utilizan herramientas de IA ni automatización.", "Nivel 1 (Inicial / Piloto): Se realizan pruebas piloto aisladas o uso informal.", "Nivel 2 (Moderado): Se emplean herramientas de IA en procesos específicos.", "Nivel 3 (Avanzado): La IA está integrada en la estrategia central de decisiones."] }
    ] },
  { t: "Módulo 2: Tipología de herramientas de IA y aplicación administrativa (Variable independiente – VI)",
    d: "",
    q: [
      { id: "P6", k: "c", excl: true, t: "P6. Marque las herramientas o soluciones tecnológicas que su organización o área utiliza actualmente para apoyar la gestión gerencial (Selección múltiple):",
        o: ["Automatización Robótica de Procesos (RPA): Software para tareas repetitivas (ej. facturación, conciliaciones).", "Analítica Predictiva y Modelos Estadísticos: Pronósticos de ventas, proyección de demanda y riesgos.", "Inteligencia Artificial Generativa: Asistentes conversacionales y generación de texto/código (ej. ChatGPT, Copilot).", "Sistemas de Soporte a la Decisión (DSS) e Inteligencia de Negocios (BI): Dashboards dinámicos interactivos.", "Algoritmos de Machine Learning especializados: Detección de fraude, segmentación avanzada de clientes.", "Ninguna de las anteriores / No aplican herramientas de IA en el área."] }
    ] },
  { t: "Módulo 3: Evaluación de beneficios en la toma de decisiones",
    d: "Dimensión evaluada: Variable dependiente (VD) – Eficiencia, rapidez y precisión",
    q: [{ k: "g", rows: [
      ["BEN01", "La integración de herramientas de IA ha reducido notablemente el tiempo requerido para tomar decisiones administrativas estratégicas."],
      ["BEN02", "Los sistemas algorítmicos y analíticos mejoran la precisión de los pronósticos gerenciales y financieros en la organización."],
      ["BEN03", "La automatización permite procesar y sintetizar grandes volúmenes de datos que manualmente no serían viables de analizar."],
      ["BEN04", "El uso de la IA ayuda a disminuir la influencia de sesgos emocionales y subjetivos en las decisiones gerenciales."],
      ["BEN05", "Las herramientas tecnológicas liberan tiempo operativo de los gerentes, permitiéndoles enfocar la gestión en decisiones complejas y creativas."]] }] },
  { t: "Módulo 4: Evaluación de riesgos operacionales y éticos",
    d: "Dimensión evaluada: Variable moderadora 1 (VM1) – Riesgo y complejidad algorítmica",
    q: [{ k: "g", rows: [
      ["RIE01", "La falta de transparencia en el funcionamiento interno de algunos algoritmos (“caja negra”) genera desconfianza al tomar decisiones."],
      ["RIE02", "Si los datos de entrada están sesgados o incompletos, existe un alto riesgo de que la IA sugiera decisiones gerenciales erróneas."],
      ["RIE03", "La automatización excesiva puede generar una dependencia tecnológica que debilite la capacidad de juicio crítico del equipo gerencial."],
      ["RIE04", "Existen preocupaciones significativas sobre la privacidad, confidencialidad y ciberseguridad al alimentar plataformas de IA con datos de la empresa."],
      ["RIE05", "La implementación de decisiones automáticas sin revisión previa puede causar fallas operacionales o impactos negativos en los clientes."]] }] },
  { t: "Módulo 5: Condiciones facilitadoras, gobernanza y supervisión humana",
    d: "Dimensión evaluada: Variable moderadora 2 (VM2) – Marco de gobernanza y supervisión ética",
    q: [{ k: "g", rows: [
      ["GOB01", "En mi organización, las decisiones estratégicas de alto impacto recomendadas por IA son siempre revisadas y validadas por un directivo humano (“Human-in-the-Loop”)."],
      ["GOB02", "La empresa cuenta con programas de capacitación para que el personal gerencial comprenda e interprete de forma adecuada las salidas de la IA."],
      ["GOB03", "Se han establecido directrices o políticas éticas claras que regulan el uso transparente y responsable de la inteligencia artificial."],
      ["GOB04", "Existe un monitoreo continuo de la calidad de los datos utilizados por las herramientas de IA para prevenir sesgos en la toma de decisiones."],
      ["GOB05", "La adopción de tecnologías inteligentes responde a una planificación estratégica formal alineada con estándares de gobernanza (ej. CONPES 4144)."]] }] }
];

/* ---------------- Construcción de la página ---------------- */
const $ = id => document.getElementById(id);
const form = $("f"), aviso = $("aviso");
const OTRO = "__other_option__";
const CONFIGURADO = CONFIG.SCRIPT_URL.includes("/exec");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const guardar = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

function opcion(tipo, id, valor, texto) {
  return `<label class="op"><input type="${tipo}" data-e="${id}" value="${esc(valor)}"><span>${texto}</span></label>`;
}
function qOpciones(q) {
  let h = `<fieldset class="q" data-req data-id="${q.id}"${q.excl ? " data-excl" : ""}><legend>${q.t}</legend>`;
  q.o.forEach((o, i) => {
    const esOtro = q.other && i === q.o.length - 1;
    const op = opcion(q.k === "c" ? "checkbox" : "radio", q.id, esOtro ? OTRO : o, o);
    h += esOtro
      ? `<div class="fila-otro">${op}<input type="text" class="otro" data-e="${q.id}" data-otro maxlength="60" placeholder="Especifique" aria-label="Especifique el sector"></div>`
      : op;
  });
  return h + `<p class="em">Esta pregunta es obligatoria.</p></fieldset>`;
}
function qLikert(r) {
  let h = `<fieldset class="q" data-req data-id="${r[0]}"><legend><span class="cod">${r[0]}.</span>${r[1]}</legend><div class="escala">`;
  ESCALA.forEach(([v, nombre, ab]) => h += `<label title="${nombre}"><input type="radio" data-e="${r[0]}" value="${v}"><span>${v}<small>${ab}</small></span></label>`);
  return h + `</div><p class="em">Esta pregunta es obligatoria.</p></fieldset>`;
}

let html = `<section class="pag">
  <div class="card">
    <h2>Sección A: Presentación e información de consentimiento informado</h2>
    <p>Estimado(a) Directivo / Gerente / Liderazgo Organizacional:</p>
    <p>El presente cuestionario forma parte de una investigación académica desarrollada en la Fundación Universitaria del Área Andina, cuyo objetivo es analizar cómo la Inteligencia Artificial (IA) y la automatización influyen en la toma de decisiones administrativas en empresas colombianas, evaluando sus beneficios en eficiencia, así como los riesgos operacionales, éticos y las necesidades de gobernanza humana.</p>
    <p><b>Tratamiento confidencial de datos (Ley 1581 de 2012 – Habeas Data):</b></p>
    <ul>
      <li><b>Anonimato e identidad:</b> Sus respuestas serán tratadas de manera estrictamente confidencial y consolidadas de forma agregada con fines puramente académicos e investigativos.</li>
      <li><b>Voluntariedad:</b> Su participación es completamente voluntaria y la cumplimentación del formulario tomará aproximadamente de 8 a 10 minutos.</li>
      <li><b>Autorización:</b> Al avanzar y responder las preguntas de este instrumento, usted declara comprender los objetivos del estudio y autoriza el uso de la información proporcionada bajo las directrices éticas mencionadas.</li>
    </ul>
  </div>
  <fieldset class="q" data-req data-id="consentimiento"><legend>Declaración de aceptación</legend>
    ${opcion("checkbox", "consentimiento", "Acepto", "Acepto voluntariamente participar en la encuesta y autorizo el tratamiento confidencial de mis respuestas bajo la Ley 1581 de 2012.")}
    <p class="em">Debe aceptar para continuar con la encuesta.</p>
  </fieldset>
</section>`;

SECCIONES.forEach(s => {
  html += `<section class="pag" hidden><div class="card"><h2>${s.t}</h2>${s.d ? `<p class="inst">${s.d}</p>` : ""}`;
  if (s.q[0].k === "g") {
    html += `<p style="margin-top:.9rem">Para las siguientes afirmaciones, indique su grado de acuerdo o desacuerdo utilizando la escala de 1 a 5:</p><ul class="leyenda">` +
      ESCALA.map(([v, n, ab]) => `<li><b>${v}</b> = ${n} (${ab})</li>`).join("") + `</ul>`;
  }
  html += `</div>`;
  s.q.forEach(q => {
    if (q.k === "g") q.rows.forEach(r => html += qLikert(r));
    else html += qOpciones(q);
  });
  html += `</section>`;
});
form.innerHTML = html;

const paginas = [...form.querySelectorAll(".pag")];
const TOTAL = paginas.length;           // 6: consentimiento + 5 módulos
let actual = 0;

/* ---------------- Interacción ---------------- */
form.addEventListener("change", e => {
  const t = e.target;
  const fs = t.closest("fieldset.q");
  if (fs) fs.classList.remove("err");

  // Campo "Otro": al elegir esa opción se enfoca el cuadro; al elegir otra, se limpia
  const otro = fs && fs.querySelector(".otro");
  if (otro && t.type === "radio") {
    if (t.value === OTRO) otro.focus(); else otro.value = "";
  }
  // P6: "Ninguna de las anteriores" excluye las demás opciones
  if (fs && fs.hasAttribute("data-excl") && t.type === "checkbox") {
    const todas = [...fs.querySelectorAll("input[type=checkbox]")];
    const ultima = todas[todas.length - 1];
    if (t === ultima && t.checked) todas.forEach(c => { if (c !== ultima) c.checked = false; });
    else if (t.checked) ultima.checked = false;
  }
});
// Escribir en el cuadro de "Otro" marca esa opción automáticamente
form.addEventListener("input", e => {
  if (!e.target.classList.contains("otro")) return;
  const fs = e.target.closest("fieldset");
  fs.querySelector(`input[type=radio][value="${OTRO}"]`).checked = true;
  fs.classList.remove("err");
});

function validar(n) {
  let primero = null;
  paginas[n].querySelectorAll("fieldset[data-req]").forEach(fs => {
    const marcado = fs.querySelector("input:checked");
    let ok = !!marcado;
    if (ok && marcado.value === OTRO) ok = fs.querySelector(".otro").value.trim() !== "";
    fs.classList.toggle("err", !ok);
    if (!ok && !primero) primero = fs;
  });
  if (primero) {
    primero.scrollIntoView({ block: "center" });
    const i = primero.querySelector("input"); if (i) i.focus({ preventScroll: true });
  }
  return !primero;
}

function mostrar(n) {
  actual = n;
  paginas.forEach((p, i) => p.hidden = i !== n);
  $("progreso").hidden = n === 0;
  $("progreso-txt").textContent = `Página ${n} de ${TOTAL - 1}`;
  $("progreso-barra").style.width = (n / (TOTAL - 1) * 100) + "%";
  $("atras").hidden = n === 0;
  $("siguiente").textContent = n === TOTAL - 1 ? "Enviar" : "Siguiente";
  aviso.textContent = "";
  window.scrollTo(0, 0);
}

function pantallaFinal(titulo, texto) {
  form.hidden = true; $("nav").hidden = true; aviso.hidden = true; $("progreso").hidden = true;
  const fin = $("fin");
  fin.innerHTML = `<h2>${titulo}</h2><p>${texto}</p>`;
  fin.hidden = false; fin.focus(); window.scrollTo(0, 0);
}

$("atras").addEventListener("click", () => mostrar(actual - 1));

$("siguiente").addEventListener("click", () => {
  if (!validar(actual)) return;
  if (actual < TOTAL - 1) { mostrar(actual + 1); return; }

  // Último paso: enviar a la hoja de cálculo
  if (!CONFIGURADO) {
    aviso.textContent = "Falta conectar el cuestionario con tu hoja de Google. Revisa el bloque CONFIG en el código.";
    return;
  }
  enviarRespuesta(recolectar());
});

// Convierte las respuestas en columnas listas para análisis estadístico
function recolectar() {
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);
  const d = { respuesta_id: id, fecha: "", consentimiento: 1 };
  SECCIONES.forEach(s => s.q.forEach(q => {
    if (q.k === "g") {
      q.rows.forEach(r => { d[r[0]] = form.querySelector(`input[data-e="${r[0]}"]:checked`).value; });
      return;
    }
    const tipo = q.k === "c" ? "checkbox" : "radio";
    const inputs = [...form.querySelectorAll(`input[type="${tipo}"][data-e="${q.id}"]`)];
    if (q.k === "c") {
      inputs.forEach((x, i) => { d[`${q.id}_${i + 1}`] = x.checked ? 1 : 0; });
    } else {
      const i = inputs.findIndex(x => x.checked);
      d[q.id] = i + 1;                       // código numérico (1 = primera opción)
      d[`${q.id}_texto`] = q.o[i];           // texto de la opción elegida
      if (q.other) d[`${q.id}_otro`] = i === q.o.length - 1 ? form.querySelector(".otro").value.trim() : "";
    }
  }));
  return d;
}

async function enviarRespuesta(d) {
  const boton = $("siguiente");
  boton.disabled = true;
  boton.textContent = "Enviando…";
  aviso.textContent = "";
  const fallo = msg => { aviso.textContent = msg; boton.disabled = false; boton.textContent = "Enviar"; };

  const cuerpo = new URLSearchParams();
  Object.entries(d).forEach(([k, v]) => cuerpo.append(k, v));
  cuerpo.append("_columnas", JSON.stringify(Object.keys(d)));

  let r = null;
  try { r = await fetch(CONFIG.SCRIPT_URL, { method: "POST", body: cuerpo }); } catch (e) { r = null; }

  if (r) {
    let j;
    try { j = await r.json(); } catch (e) { return fallo("El servidor respondió algo inesperado. Intenta de nuevo en unos minutos."); }
    if (!j.ok) return fallo("No se pudo guardar la respuesta. Intenta de nuevo.");
  } else {
    // Algunos navegadores ocultan la respuesta: reenviamos sin leerla (el script ignora duplicados)
    try { await fetch(CONFIG.SCRIPT_URL, { method: "POST", body: cuerpo, mode: "no-cors" }); }
    catch (e) { return fallo("No hay conexión. Revisa tu internet e intenta de nuevo."); }
  }
  guardar.set("iaaam_enviado", "1");
  pantallaFinal("Tu respuesta fue registrada", "Gracias por participar en esta investigación académica.");
}

/* ---------------- Inicio ---------------- */
if (CONFIG.LIMITAR_UNA_RESPUESTA && guardar.get("iaaam_enviado")) {
  pantallaFinal("Ya registraste una respuesta", "Solo se permite una respuesta por persona desde este dispositivo. Gracias por participar.");
} else {
  mostrar(0);
}
</script>
